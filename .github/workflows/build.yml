name: build

# 说明：原始素材（人间防骗指南.md）本地维护、不入库，因此这里不设 push / 定时触发，
# 避免仓库里没有素材时构建出空站、覆盖已发布产物。
# 全部产物在本地跑 tools/ 下的脚本生成后再提交。
#
# 需要在云端重建时（例如把素材也放进仓库、或在 fork 里维护素材）手动触发即可：
# Actions → build → Run workflow。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖与中文字体
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pip install reportlab genanki

      - name: 检查素材是否存在
        id: guard
        run: |
          if [ ! -f "人间防骗指南.md" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::warning::未找到素材文件，跳过构建（素材本地维护、不入库）。"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 解析素材（分篇 + 结构化 + 分类）
        if: steps.guard.outputs.skip == '0'
        run: python tools/parse_articles.py

      - name: 构建离线单文件应用
        if: steps.guard.outputs.skip == '0'
        run: python tools/build_offline.py

      - name: 构建 book / docs / README / index.html
        if: steps.guard.outputs.skip == '0'
        run: python tools/build_repo.py

      - name: 构建 目录 / 术语表 / 核实记录
        if: steps.guard.outputs.skip == '0'
        run: python tools/build_docs.py

      - name: 构建 PDF / EPUB / Anki / HTML 下载物
        if: steps.guard.outputs.skip == '0'
        run: python tools/build_downloads.py

      - name: 提交并推送构建产物
        if: steps.guard.outputs.skip == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的构建产物"
          else
            git commit -m "chore: 自动重建全部构建产物 [skip ci]"
            git push
          fi
