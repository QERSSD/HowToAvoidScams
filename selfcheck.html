<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活自查 · 人间防骗指南</title>
<style>
:root{
  --brand-1:#b4272e; --brand-2:#d64b4b; --bg:#ffffff; --bg-elv:#f6f6f7; --bg-soft:#f2f3f5;
  --t1:#1f2329; --t2:#4e5969; --t3:#86909c; --divider:#e5e6eb; --ok:#2e7d32; --warn-bg:#fff7e8; --ok-bg:#eef7ee;
}
@media (prefers-color-scheme: dark){ :root:not(.light){
  --brand-1:#e56464; --brand-2:#f0883a; --bg:#17181c; --bg-elv:#1e2026; --bg-soft:#26282f;
  --t1:#e8eaed; --t2:#b4bac4; --t3:#7d8590; --divider:#33363d; --ok:#6fbf73; --warn-bg:#3a3220; --ok-bg:#203124;
}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--t1);line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 80px}
header h1{font-size:26px;margin:0 0 6px}
header h1 em{color:var(--brand-1);font-style:normal}
header p{color:var(--t2);margin:0 0 14px;font-size:14.5px}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--divider);
     padding:10px 0;margin-bottom:18px}
.bar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog{flex:1;min-width:200px;height:10px;background:var(--bg-soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand-1),var(--brand-2));
        border-radius:99px;transition:width .4s}
.stat{font-size:13px;color:var(--t2);white-space:nowrap}
.stat b{color:var(--brand-1);font-size:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--divider);background:var(--bg-elv);color:var(--t1);
       border-radius:8px;padding:5px 12px;font-size:13px}
button:hover{border-color:var(--brand-1);color:var(--brand-1)}
.btn-main{background:var(--brand-1);border-color:var(--brand-1);color:#fff;font-weight:600}
.btn-main:hover{color:#fff;opacity:.9}
.grp{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.grp h2{font-size:17px;margin:0}
.grp .gd{font-size:12.5px;color:var(--t3)}
.q{border:1px solid var(--divider);border-radius:12px;background:var(--bg);padding:13px 16px;margin:10px 0;
    display:flex;gap:14px;align-items:flex-start;transition:border-color .2s}
.q.yes{border-color:transparent;background:var(--ok-bg)}
.q.no{border-color:transparent;background:var(--warn-bg)}
.q .qt{flex:1;font-size:14.5px}
.q .qt small{display:block;color:var(--t3);font-size:12.5px;margin-top:3px;line-height:1.6}
.q .qt a{color:var(--brand-1);text-decoration:none;font-size:12.5px}
.q .qt a:hover{text-decoration:underline}
.opts{display:flex;gap:8px;flex-shrink:0;padding-top:2px}
.opt{width:52px;text-align:center;border:1px solid var(--divider);border-radius:8px;padding:4px 0;
      font-size:13px;background:var(--bg-elv);color:var(--t2);user-select:none;cursor:pointer}
.q[data-v="yes"] .opt-yes{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.q[data-v="no"]  .opt-no {background:#c77800;border-color:#c77800;color:#fff;font-weight:700}
#result{margin-top:34px;border:1px solid var(--divider);border-radius:14px;background:var(--bg-elv);padding:20px 22px}
#result h2{margin:0 0 4px;font-size:19px}
#result .sub{color:var(--t2);font-size:13.5px;margin-bottom:14px}
.todo{background:var(--bg);border:1px solid var(--divider);border-left:4px solid var(--brand-1);border-radius:10px;
      padding:10px 14px;margin:8px 0}
.todo b{font-size:14.5px}
.todo .why{color:var(--t2);font-size:13px;margin-top:2px}
.todo a{color:var(--brand-1);font-size:12.5px;text-decoration:none}
.todo a:hover{text-decoration:underline}
.gbars{margin:14px 0 4px}
.gbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.gbar .gl{width:130px;color:var(--t2);flex-shrink:0}
.gbar .gb{flex:1;height:8px;background:var(--bg-soft);border-radius:99px;overflow:hidden}
.gbar .gb i{display:block;height:100%;background:var(--ok);border-radius:99px}
.gbar .gn{width:56px;color:var(--t3);text-align:right}
.foot{margin-top:26px;color:var(--t3);font-size:12.5px;line-height:1.8}
.foot a{color:var(--brand-1);text-decoration:none}
@media (max-width:560px){ .q{flex-direction:column;gap:8px} .opts{align-self:flex-end} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>生活自查 · <em>人间防骗指南</em></h1>
  <p><span id="qn">45</span> 道是否题，看看书里哪些事你还没做到。没有标准答案的焦虑，只有能落地的动作——答完告诉你先做哪几件。</p>

</div></div>

<div id="qs"></div>

<div id="result" hidden>

  <div class="gbars" id="r-bars"></div>
</div>

<div class="foot">
  进度自动保存在本机浏览器（localStorage），不上传任何数据。<br>
  关联拆解编号与 <a href="人间防骗指南.html">离线单文件应用</a>、PDF / EPUB 书签、Anki 卡片一致；黑话见 <a href="docs/术语表.md">术语表</a>，案例来源见 <a href="docs/核实记录.md">核实记录</a>。
</div>
</div>

const $=s=>document.querySelector(s);
const KEY='fangpian-selfcheck-v1';
let state={};
const store=(()=>{try{localStorage.setItem('t','1');localStorage.removeItem('t');return localStorage}
  catch(e){let m={};return{getItem:k=>m[k]||null,setItem:(k,v)=>{m[k]=v},removeItem:k=>{delete m[k]}}}})();
try{state=JSON.parse(store.getItem(KEY)||'{}')}catch(e){}

function save(){try{store.setItem(KEY,JSON.stringify(state))}catch(e){}}

function render(){
  const qs=$('#qs');
  qs.innerHTML=G.map((g,gi)=>{
    const items=Q.map((q,qi)=>[q,qi]).filter(([q])=>q[0]===gi);
    return '<div class="grp"><h2>'+g[0]+' '+g[1]+'</h2><span class="gd">'+g[2]+' · '+items.length+' 题</span></div>'+
      items.map(([q,qi])=>qHtml(q,qi)).join('');
  }).join('');
  document.querySelectorAll('.q .opt').forEach(b=>{
    b.addEventListener('click',()=>{
      const i=+b.closest('.q').dataset.i, v=b.dataset.v;
      if(state[i]===v) delete state[i]; else state[i]=v;
      save();render();
    });
  });
  tally();
}
function qHtml(q,i){
  const v=state[i]||'';
  return '<div class="q '+v+'" data-i="'+i+'" data-v="'+v+'"><div class="qt">'+q[1]+
    '<small>'+q[4]+'</small>'+
    (q[3]?'<a href="人间防骗指南.html#p'+q[3]+'" title="编号 '+q[3]+'">看完整拆解 →</a>':'')+
    '</div><div class="opts">'+
    '<span class="opt opt-yes" data-v="yes">✓ 做到</span>'+
    '<span class="opt opt-no" data-v="no">✗ 没有</span></div></div>';
}
function tally(){
  const answered=Object.keys(state).length;
  const yes=Object.values(state).filter(v=>v==='yes').length;
  $('#done').textContent=yes;
  $('#total').textContent=Q.length;
  $('#pi').style.width=(yes/Q.length*100)+'%';
  const R=$('#result');
  if(answered>=10){R.hidden=false;renderResult(yes)}else{R.hidden=true}
}
function renderResult(yes){
  const pct=yes/Q.length;
  $('#r-title').textContent = pct>=.8?'防线基本牢固，保持警惕':
    pct>=.5?'过了一半，还有关键缺口':'漏洞不少，先补最要命的几件';
  $('#r-sub').textContent='已做到 '+yes+' / '+Q.length+' 项，答完 '+Object.keys(state).length+' 题。下面按优先级列出你还没做到、且最要命的动作：';
  const todos=Q.map((q,i)=>({q,i})).filter(x=>state[x.i]==='no'&&x.q[2]===1)
    .concat(Q.map((q,i)=>({q,i})).filter(x=>state[x.i]==='no'&&x.q[2]===2).slice(0,3))
    .slice(0,8);
  $('#r-todos').innerHTML = todos.length? todos.map(x=>
    '<div class="todo"><b>'+x.q[1]+'</b><div class="why">'+x.q[4]+'</div>'+
    (x.q[3]?'<a href="人间防骗指南.html#p'+x.q[3]+'">看完整拆解 →</a>':'')+'</div>').join('')
    : '<div class="todo"><b>没有高危缺口 🎉</b><div class="why">优先级最高的几项你都做到了——继续保持，并把这套题发给家人做一遍。</div></div>';
  const bars=G.map((g,gi)=>{
    const items=Q.map((q,i)=>({q,i})).filter(x=>x.q[0]===gi);
    const y=items.filter(x=>state[x.i]==='yes').length;
    const pc=items.length?Math.round(y/items.length*100):0;
    return '<div class="gbar"><span class="gl">'+g[0]+' '+g[1]+'</span><span class="gb"><i style="width:'+pc+'%"></i></span><span class="gn">'+y+'/'+items.length+'</span></div>';
  }).join('');
  $('#r-bars').innerHTML='<div style="font-weight:600;margin-bottom:4px">各板块完成度</div>'+bars;
}
$('#reset').addEventListener('click',()=>{state={};save();render()});
$('#qn').textContent=Q.length;
$('#total').textContent=Q.length;
render();
</script>
</body>
</html>
